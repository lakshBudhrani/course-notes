baseURL = 'https://lakshbudhrani.com/'
languageCode = 'en-us'
title = 'Laksh Budhrani | Course Hub'
theme = 're-terminal'

canonifyURLs = true

[params]
  title = "Laksh Budhrani"
  subtitle = "Computer Science Educator"
  mainSections = ["courses"]
  math = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['$$', '$$']]
          inline = [['$', '$']]